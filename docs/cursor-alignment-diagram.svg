<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6ccb5f"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c8c8c8"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#3a1d1d"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#ff6b6b" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="920" height="330" rx="12" fill="#202020"/>

  <!-- ================= LEFT: Windows default ================= -->
  <text x="230" y="36" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">Windows on its own</text>
  <text x="230" y="58" text-anchor="middle" fill="#a0a0a0" font-size="12.5">Screens are lined up in raw pixels</text>

  <rect x="30" y="80" width="240" height="135" rx="6" fill="#2d2d2d" stroke="#5a5a5a" stroke-width="1.5"/>
  <text x="150" y="140" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">4K · 150%</text>
  <text x="150" y="158" text-anchor="middle" fill="#a0a0a0" font-size="11">3840 × 2160 px</text>

  <rect x="270" y="99.6" width="160" height="90" rx="6" fill="#2d2d2d" stroke="#5a5a5a" stroke-width="1.5"/>
  <text x="350" y="141" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">1440p · 100%</text>
  <text x="350" y="159" text-anchor="middle" fill="#a0a0a0" font-size="11">2560 × 1440 px</text>

  <!-- dead zones -->
  <rect x="264" y="80" width="6" height="19.6" fill="url(#hatch)"/>
  <rect x="264" y="189.6" width="6" height="25.4" fill="url(#hatch)"/>

  <!-- stuck cursor -->
  <line x1="180" y1="204" x2="258" y2="204" stroke="#c8c8c8" stroke-width="2" marker-end="url(#aw)"/>
  <g stroke="#ff6b6b" stroke-width="2.5" stroke-linecap="round">
    <line x1="274" y1="198" x2="286" y2="210"/><line x1="286" y1="198" x2="274" y2="210"/>
  </g>
  <!-- crosses at same pixel row -> wrong relative height -->
  <line x1="180" y1="120" x2="300" y2="120" stroke="#c8c8c8" stroke-width="2" marker-end="url(#aw)"/>

  <text x="230" y="250" text-anchor="middle" fill="#ff8a8a" font-size="12.5">✕ Cursor gets stuck on the red parts of the edge</text>
  <text x="230" y="270" text-anchor="middle" fill="#ff8a8a" font-size="12.5">✕ Where it does cross, it lands at the wrong height</text>
  <text x="230" y="290" text-anchor="middle" fill="#a0a0a0" font-size="11.5">(Windows' "ease cursor movement" only half fixes this)</text>

  <!-- divider -->
  <line x1="460" y1="24" x2="460" y2="306" stroke="#3a3a3a" stroke-width="1"/>

  <!-- ================= RIGHT: ScreenShift ================= -->
  <text x="690" y="36" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">With ScreenShift</text>
  <text x="690" y="58" text-anchor="middle" fill="#a0a0a0" font-size="12.5">Edges are matched by scale, not raw pixels</text>

  <rect x="490" y="80" width="240" height="135" rx="6" fill="#2d2d2d" stroke="#5a5a5a" stroke-width="1.5"/>
  <text x="565" y="140" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">4K · 150%</text>
  <text x="565" y="158" text-anchor="middle" fill="#a0a0a0" font-size="11">looks like 2560 × 1440</text>

  <rect x="730" y="99.6" width="160" height="90" rx="6" fill="#2d2d2d" stroke="#5a5a5a" stroke-width="1.5"/>
  <text x="810" y="141" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">1440p · 100%</text>
  <text x="810" y="159" text-anchor="middle" fill="#a0a0a0" font-size="11">2560 × 1440</text>

  <!-- full edge glow -->
  <line x1="730" y1="81" x2="730" y2="214" stroke="#6ccb5f" stroke-width="3" opacity="0.55"/>

  <!-- top -> top, middle -> middle, bottom -> bottom -->
  <path d="M672,86 C710,86 720,103 752,103" fill="none" stroke="#6ccb5f" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M672,147.5 C710,147.5 720,144.6 752,144.6" fill="none" stroke="#6ccb5f" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M672,209 C710,209 720,186 752,186" fill="none" stroke="#6ccb5f" stroke-width="2" marker-end="url(#ag)"/>
  <text x="668" y="90" text-anchor="end" fill="#6ccb5f" font-size="10.5">top</text>
  <text x="668" y="151" text-anchor="end" fill="#6ccb5f" font-size="10.5">middle</text>
  <text x="668" y="213" text-anchor="end" fill="#6ccb5f" font-size="10.5">bottom</text>

  <text x="690" y="250" text-anchor="middle" fill="#8fdc84" font-size="12.5">✓ The whole edge works, no dead zones</text>
  <text x="690" y="270" text-anchor="middle" fill="#8fdc84" font-size="12.5">✓ Lands at the exact matching spot, both directions</text>
  <text x="690" y="290" text-anchor="middle" fill="#a0a0a0" font-size="11.5">Games that lock the cursor are left alone</text>
</svg>
